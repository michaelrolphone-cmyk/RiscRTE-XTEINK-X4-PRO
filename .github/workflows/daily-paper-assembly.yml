name: Daily Paper firmware assembly
on:
  push:
    branches: [feat/daily-digest]
    paths: ['.github/workflows/daily-paper-assembly.yml', 'minimal/scripts/build_daily_paper_launchers.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: X4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 7071f0c25e223f24670bed409a5f8b6f291c8042
          path: Native
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 8ddd9bcf751cecfcf74a67c50c809b87ec75fcc3
          path: System
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: e80172353fcb9e6519ca9d9b2a4d43c69c1bc91d
          path: Utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: db5f6c5ba1a71ed3fcc22ff29847397a050b7ee4
          path: Tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Productivity
          ref: ba486e56dbf145a9c05d5bb36b39d9b81e0b7ece
          path: Productivity
          persist-credentials: false
      - name: Resolve historical SDK inputs used by current launcher builders
        run: |
          git -C Native fetch --depth 1 origin dfc0af505eb9a63092871f35e60ab2716a91d8f9
          git -C Native fetch --depth 1 origin 274bc66f193cbe29018d2a85c9400cb0dce8aacc
      - name: Install matching Xtensa compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Collect reproducible local assembly inputs
        run: |
          mkdir -p evidence
          tar --exclude='*.ttf' --exclude='*.otf' -czf evidence/daily-paper-assembly-sources.tar.gz Native System Utilities Tools Productivity X4
          tar -C "$HOME/.platformio/packages" -czf evidence/daily-paper-compiler.tar.gz toolchain-xtensa-esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: daily-paper-assembly-inputs
          path: evidence/
          retention-days: 1
