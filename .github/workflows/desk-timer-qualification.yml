name: Delivered X4 desk timer qualification
on:
  push:
    branches: [work/x4-desk-clock-timer-20261016]
  pull_request:
    paths:
      - minimal/test/qualify_desk_timer_progression.py
      - minimal/recovery-107/build_clock.py
      - minimal/apps/portable_sleep.c
      - .github/workflows/desk-timer-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivered-home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 09400a550562ca9568ac7ab664ba3222eeedf2c8
          path: deps/system
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: a91edf3fada6a559ec107186dd163d0c8da10d29
          path: deps/tooling
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: dcbad832cff91f7988a8e43d84725650b9815953
          fetch-depth: 0
          path: deps/utilities
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: c98e4222048244b1e729869ed47aa99130025fd3
          path: deps/reader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact delivered compiler generation
        run: |
          pip install platformio==6.1.19 pyelftools==0.32 Pillow==11.3.0
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Reproduce published Home bytes
        run: |
          python minimal/recovery-107/build_clock.py --system deps/system --x4 . --runtime deps/tooling --sdk deps/reader/sdk/driver --utilities deps/utilities --reader-scripts deps/reader/scripts --compiler "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --output reproduced
          echo '02b38ed65e1adcb8ecd49c0dc6b58f678ea0110160e38f4f70ed61c5e0b484d7  reproduced/home/default.elf' | sha256sum -c -
      - name: Qualify selected timer profile and minute progression
        run: |
          python deps/system/scripts/test_context_sparse_timer.py --candidate reproduced/home --runtime-sdk deps/tooling/sdk/app --sleep-source minimal/apps/portable_sleep.c --output evidence/selected-timer --timer-storage
          python minimal/test/qualify_desk_timer_progression.py --timer-proof evidence/selected-timer --output evidence/minute-progression
      - name: Qualify RTC recovery and ordinary foreground return
        run: |
          python deps/system/scripts/test_sparse_rtc_reconcile.py --runtime deps/tooling --sdk deps/reader/sdk/driver --x4 .
          python deps/system/scripts/test_sparse_rtc_reconcile.py --runtime deps/tooling --sdk deps/reader/sdk/driver --x4 . --sanitizer address,undefined
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x4-desk-timer-qualification
          path: |
            reproduced/home/build-evidence.json
            reproduced/command.json
            evidence/selected-timer/receipt.json
            evidence/minute-progression/receipt.json
          retention-days: 30
