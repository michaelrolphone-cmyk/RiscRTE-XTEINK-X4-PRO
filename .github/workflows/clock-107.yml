name: X4 0.1.107 Clock target
on:
  push:
    branches: [integrate/x4-107-clock]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 3f7474bbbdaacb7fb196a8c6b74a23017eff2772
          path: deps/system
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: a91edf3fada6a559ec107186dd163d0c8da10d29
          path: deps/runtime
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: dcbad832cff91f7988a8e43d84725650b9815953
          fetch-depth: 0
          path: deps/utilities
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: c98e4222048244b1e729869ed47aa99130025fd3
          path: deps/reader
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install delivered compiler generation
        run: |
          pip install platformio==6.1.19 pyelftools==0.32 Pillow==11.3.0
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build full delivered Home profile twice
        run: |
          for output in target-a target-b; do
            python minimal/recovery-107/build_clock.py --system deps/system --x4 . --runtime deps/runtime --sdk deps/reader/sdk/driver --utilities deps/utilities --reader-scripts deps/reader/scripts --compiler "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --output "$output"
          done
          cmp target-a/home/default.elf target-b/home/default.elf
          cmp target-a/home/default.json target-b/home/default.json
          sha256sum target-a/home/default.elf target-a/home/default.json
      - uses: actions/upload-artifact@v4
        with:
          name: x4-107-clock-target-evidence
          path: |
            target-a/home/default.elf
            target-a/home/default.json
            target-a/home/build-evidence.json
            target-a/command.json
          retention-days: 14
