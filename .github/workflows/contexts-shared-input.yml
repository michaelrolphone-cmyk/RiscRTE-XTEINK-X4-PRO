name: Contexts shared-input recipe
on:
  push:
    branches: [work/contexts-shared-input-20261012]
  pull_request:
    paths: ['**/*contexts_shared_input*', '**/contexts-shared-input/**', '.github/workflows/contexts-shared-input.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 minimal/test/contexts_shared_input_recipe_test.py
      - run: python3 -m py_compile minimal/scripts/build_contexts_shared_input.py minimal/scripts/compose_contexts_shared_input.py minimal/scripts/inspect_contexts_target_stack.py minimal/scripts/test_contexts_flagoff_target.py minimal/scripts/qualify_contexts_shared_input.py
