name: Typed minimal X4 drivers
on: [push, pull_request, workflow_dispatch]
env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "No"
jobs:
  host-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 2bcc2094808f9770e83eb84205a75c5407aeb0cf
          path: .shared/runtime
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: 29276b4e1cff7819af065a77cf64805f6d5a12ce
          path: .shared/reader
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 4a24bc43afcdfa70a48b5a9ee5dfefc9a109c4a8
          path: .shared/apps
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: 39b9be00528c404af63c8f654d1bd2b29cf73b18
          path: .shared/drivers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.1.19 pyelftools==0.32
      - name: Host lifecycle and wire simulations
        env:
          RISCRTE_RUNTIME_ROOT: ${{ github.workspace }}/.shared/runtime
          RISCRTE_DRIVERS_ROOT: ${{ github.workspace }}/.shared/drivers
          RISCRTE_READER_ROOT: ${{ github.workspace }}/.shared/reader
          RISCRTE_APPS_ROOT: ${{ github.workspace }}/.shared/apps
          RISCRTE_DESK_SDK_ROOT: ${{ github.workspace }}/.shared/reader
          SANITIZE: '1'
          RUNTIME_REPO: ${{ github.workspace }}/.shared/runtime
        run: |
          bash .shared/reader/test/run_display_power_contract_test.sh
          bash .shared/reader/test/run_touch_power_test.sh
          bash .shared/reader/test/storage_volume/run_sleep_extension_test.sh
          bash minimal/test/run_bootlog_test.sh
          python3 minimal/test/boot_logging_profile_test.py
          python3 minimal/test/prepare_sdk_test.py
          python3 minimal/test/sd_first_placement_test.py
          python3 minimal/test/bundle_identity_test.py
          python3 minimal/test/app_bundle_grants_test.py
          python3 minimal/test/sparse_app_grants_test.py
          python3 minimal/test/sparse_clock_profile_test.py
          python3 minimal/test/settings_power_profile_test.py
          python3 minimal/test/desk_clock_bundle_test.py
          python3 minimal/test/provisioning_profile_test.py
          bash minimal/test/run_native_gpio_readback_test.sh
          bash minimal/test/run_board_keepalive_cpu_test.sh
          bash minimal/test/run_frontlight_cpu_port_test.sh
          for driver in board_power i2c panel frontlight buttons rtc sd battery gt911; do
            bash minimal/test/run_${driver}_test.sh
          done
          bash minimal/test/run_power_test.sh
          bash minimal/test/run_power_navigation_test.sh
          bash minimal/test/run_clock_sleep_test.sh
          bash minimal/test/run_desk_clock_sleep_test.sh
          bash minimal/test/run_desk_clock_typed_app_test.sh
          python3 minimal/test/sleep_profile_test.py
          bash minimal/test/run_profile_test.sh
          bash .shared/runtime/test/run_staged_app_install_test.sh
          bash .shared/runtime/test/run_sd_first_key_value_test.sh
          bash .shared/runtime/test/run_removable_runtime_test.sh
          bash .shared/apps/scripts/test_installed_apps_service.sh
          bash .shared/apps/scripts/test_installed_apps_install.sh
          bash .shared/apps/scripts/test_installed_catalog_client.sh
          bash .shared/apps/scripts/test_app_store_installed.sh
      - name: Install pinned target compiler
        run: pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and validate ordinary Xtensa providers
        run: >-
          python3 minimal/scripts/build_drivers.py
          --runtime .shared/runtime --reader .shared/reader --drivers .shared/drivers
          --source-lock minimal/test/ordinary-driver-sources.lock.json
          --cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          --output build/minimal-drivers --sleep
      - name: Build ordinary installed-catalog provider
        run: >-
          NATIVE_APP_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          python3 .shared/apps/scripts/build_installed_apps.py
          --runtime-repo .shared/runtime --output-dir build/installed-catalog
      - uses: actions/upload-artifact@v4
        with:
          name: x4-typed-drivers-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/minimal-drivers
            build/installed-catalog
