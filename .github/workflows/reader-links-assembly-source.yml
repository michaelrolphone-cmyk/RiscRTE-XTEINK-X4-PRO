name: Publish Reader links assembler
on:
  push:
    branches: [feat/reader-nova7-gui]
    paths: [.github/workflows/reader-links-assembly-source.yml]
permissions:
  contents: read
jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested version selection delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:minimal/scripts/package_reader_bin_overlay.py)" = a2028c44e3a9412cd3b0f6cea2d98b07f5dbdae0
          python3 - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          encoded=''
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='7eb976a1e0045346f7b70a94efe9e6ccd66e26dfe9f2aca88dd0f4583f6914b6'
          Path('/tmp/assembler.patch').write_bytes(patch)
          PY
          git apply --check /tmp/assembler.patch
          git apply --index /tmp/assembler.patch
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Select Reader 0.1.8 and scene 0.3.6 over exact X4 0.1.76 BIN for 0.1.77'
          git push origin HEAD:feat/reader-nova7-gui
