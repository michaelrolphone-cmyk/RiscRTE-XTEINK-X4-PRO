name: Reader firmware assembly tools
on:
  push:
    branches: [feat/reader-nova7-gui]
    paths: [.github/workflows/reader-assembly-tools.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: X4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 7071f0c25e223f24670bed409a5f8b6f291c8042
          path: Runtime075
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: db5f6c5ba1a71ed3fcc22ff29847397a050b7ee4
          path: Tools
          persist-credentials: false
      - name: Build independent SPIFFS reader with deployed ABI2 geometry
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch 0.2.3 --depth 1 --recurse-submodules https://github.com/igrr/mkspiffs.git Mkspiffs
          test "$(git -C Mkspiffs rev-parse HEAD)" = 112d65368043f01dd86813cb84e41b1159a34f6b
          make -C Mkspiffs -j2 CPPFLAGS='-DSPIFFS_OBJ_META_LEN=4'
          Mkspiffs/mkspiffs --version | tee mkspiffs-version.txt
          git -C Mkspiffs rev-parse HEAD > mkspiffs-source.txt
          git -C Mkspiffs submodule status >> mkspiffs-source.txt
          sha256sum Mkspiffs/mkspiffs > mkspiffs.sha256
      - name: Archive assembly and validation sources
        run: |
          set -euo pipefail
          tar -czf reader-assembly-tools.tar.gz X4 Runtime075 Tools/scripts Tools/tests Tools/vendor Mkspiffs mkspiffs-version.txt mkspiffs-source.txt mkspiffs.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: reader-assembly-tools
          path: reader-assembly-tools.tar.gz
          compression-level: 0
          retention-days: 7
