name: Daily Paper X4 registration
on:
  push:
    branches: [feat/daily-digest]
    paths: ['minimal/scripts/integrate_daily_digest.py', 'minimal/test/test_daily_digest_integration.py', 'minimal/sd-app-catalog.json', '.github/workflows/daily-paper.yml']
  pull_request:
    paths: ['minimal/scripts/integrate_daily_digest.py', 'minimal/test/test_daily_digest_integration.py', 'minimal/sd-app-catalog.json', '.github/workflows/daily-paper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 minimal/test/test_daily_digest_integration.py
