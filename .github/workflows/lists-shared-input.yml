name: Lists shared-input recipe
on:
  push:
    branches: [work/lists-shared-input-20261012]
  pull_request:
    paths: ['**/*lists_*', '**/lists-shared-input/**', '.github/workflows/lists-shared-input.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 minimal/test/lists_shared_input_recipe_test.py
      - run: python3 -m py_compile minimal/scripts/build_lists_shared_input.py minimal/scripts/build_lists_text_host.py minimal/scripts/build_lists_scene_host.py minimal/scripts/build_lists_resident_owner.py minimal/scripts/test_lists_scene_predecessor.py minimal/scripts/inspect_lists_text_target.py minimal/scripts/inspect_lists_scene_target.py minimal/scripts/inspect_lists_owner_target.py minimal/scripts/test_lists_text_predecessor.py minimal/scripts/compose_lists_shared_input.py minimal/scripts/inspect_lists_target_stack.py minimal/scripts/test_lists_flagoff_target.py minimal/scripts/qualify_lists_shared_input.py
