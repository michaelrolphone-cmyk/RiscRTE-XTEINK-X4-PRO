name: OBD assembly sources
on:
  push:
    branches: [feat/obd-dashboard]
    paths: [.github/workflows/obd-assembly-sources.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 7071f0c25e223f24670bed409a5f8b6f291c8042
          path: Runtime
          persist-credentials: false
      - name: Fetch retained toolbar SDK revision
        run: |
          git -C Runtime fetch --depth 1 origin 274bc66f193cbe29018d2a85c9400cb0dce8aacc
          git -C Runtime show 274bc66f193cbe29018d2a85c9400cb0dce8aacc:sdk/app/RiscRuntimeV1.h > /dev/null
          test "$(git -C Runtime rev-parse HEAD)" = 7071f0c25e223f24670bed409a5f8b6f291c8042
          tar -czf obd-runtime-sources.tar.gz Runtime
      - uses: actions/upload-artifact@v4
        with:
          name: obd-runtime-sources
          path: obd-runtime-sources.tar.gz
          compression-level: 0
          retention-days: 7
