name: OBD assembly sources
on:
  push:
    branches: [feat/obd-dashboard]
    paths: [.github/workflows/obd-assembly-sources.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: X4
          persist-credentials: false
      - name: Fetch pinned component closure
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            git init "$1"
            git -C "$1" remote add origin "https://github.com/michaelrolphone-cmyk/$2.git"
            git -C "$1" fetch --depth 1 origin "$3"
            git -C "$1" checkout --detach FETCH_HEAD
          }
          fetch Runtime RiscRTE 7071f0c25e223f24670bed409a5f8b6f291c8042
          fetch System RiscRTE-System-Apps dea97a70cdcc657c5d2b2730ca2b62715949a10a
          fetch Drivers RiscRTE-Drivers 8ec572af94ee6e844b1685d8d050471cd58cad87
          fetch Utilities RiscRTE-Utilities 866653f3694fa6f0276cd1931df4da3f9ad3be36
          git -C Runtime fetch --depth 1 origin 274bc66f193cbe29018d2a85c9400cb0dce8aacc
          test "$(git -C Runtime rev-parse HEAD)" = 7071f0c25e223f24670bed409a5f8b6f291c8042
          tar -czf obd-delivery-sources.tar.gz X4 Runtime System Drivers Utilities
      - uses: actions/upload-artifact@v4
        with:
          name: obd-delivery-sources
          path: obd-delivery-sources.tar.gz
          compression-level: 0
          retention-days: 7
