name: OBD assembly sources
on:
  push:
    branches: [feat/obd-dashboard]
    paths: [.github/workflows/obd-assembly-sources.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: 45cf61ac013fb618e8d7fed63217a35350484d52
          path: ReaderSDK
          persist-credentials: false
          sparse-checkout: sdk
      - name: Archive canonical headers
        run: tar -czf obd-driver-sdk.tar.gz ReaderSDK/sdk
      - uses: actions/upload-artifact@v4
        with:
          name: obd-driver-sdk
          path: obd-driver-sdk.tar.gz
          compression-level: 0
          retention-days: 7
