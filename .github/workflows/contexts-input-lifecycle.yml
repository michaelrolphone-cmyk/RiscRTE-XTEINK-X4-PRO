name: Contexts lifecycle recipe
on:
  push:
    branches: [work/contexts-input-lifecycle-20261012]
  pull_request:
    paths: ['**/*contexts*life*', '**/contexts-input-lifecycle/**', '.github/workflows/contexts-input-lifecycle.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 minimal/test/contexts_input_lifecycle_recipe_test.py
      - run: python3 -m py_compile minimal/scripts/build_contexts_input_lifecycle.py minimal/scripts/compose_contexts_input_lifecycle.py minimal/scripts/inspect_contexts_lifecycle_stack.py minimal/scripts/test_contexts_lifecycle_flagoff.py minimal/scripts/run_contexts_input_lifecycle.py
