name: X4 0.1.108 RF component and modal lifecycle
on:
  push:
    branches: [integrate/x4-108-rf-policy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: fd4b1e52fe2a49c3c4c22f9ccd4c98a91f88afa0
          path: deps/system
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 52157660ec573cf4639ffe3eefcad5b7b3115c4e
          path: deps/utilities
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 1c1ed8661ea30d47e7e9707c41d492ce3a2b4d70
          path: deps/build-sdk
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: a91edf3fada6a559ec107186dd163d0c8da10d29
          path: deps/native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned compiler and host dependencies
        run: |
          pip install platformio==6.1.19 pyelftools==0.32 Pillow==11.3.0 fonttools==4.60.1
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Reproduce qualified X4 component exactly
        run: |
          python minimal/recovery-108/build_rf.py --system deps/system --utilities deps/utilities --runtime-sdk deps/build-sdk --compiler "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --output target-rf
      - name: Real X4 app, adapter, text and scene modal lifecycle under ASan and UBSan
        run: |
          python minimal/recovery-108/test_modal.py --utilities deps/utilities --system-apps deps/system --x4-host-system deps/system --runtime deps/native --x4-runtime deps/native --x4-recipe minimal/recovery-108/qualified-target.json --baseline-utilities deps/utilities --x4-baseline deps/utilities --target x4 --extra-define PORTABLE_TEXT_INPUT_POLICY --scenario policy-stopped-done --scenario policy-stopped-cancel --scenario policy-active --scenario policy-unavailable --scenario policy-continuity --scenario policy-retained --output rf-modal-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x4-108-rf-target-and-modal-evidence
          path: |
            target-rf/waterfall.elf
            target-rf/waterfall.json
            target-rf/build-record.json
            rf-modal-tests/qualification.json
            rf-modal-tests/**/run.log
          retention-days: 14
